# Re-resuelve `api` con el DNS interno de Docker para no quedarse con IPs viejas
# cuando Dokploy recrea el contenedor de la API.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
  zone api 64k;
  server api:4351 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # La API solo es alcanzable a través de este proxy (mismo origen, sin CORS).
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host api:4351;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
