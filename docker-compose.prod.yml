# Despliegue en Dokploy (tipo "Docker Compose").
# 1. Crea la app, apunta este archivo como Compose Path.
# 2. En "Domains", agrega tu dominio al servicio `web`, puerto 80.
# 3. Define WEB_ORIGIN con el dominio público (https://...), sin barra final.
# 4. Define ADMIN_PASSWORD (obligatoria), ADMIN_USER y SESSION_SECRET en "Environment".
# No definas NODE_ENV=production: la API se niega a arrancar así por diseño.
name: admision

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      HOST: 0.0.0.0
      PORT: "4351"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api:4351}
      WEB_ORIGIN: ${WEB_ORIGIN:?Define WEB_ORIGIN con el dominio publico, p. ej. https://epgsoporte.online}
      # Acceso al panel y sesiones (el codigo en produccion los usa).
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      DATA_DIR: /data
      FUENTE_PATH: /data/fuentes-excel/grupos.json
      # Acceso al panel interno. ADMIN_PASSWORD es obligatoria: sin ella el despliegue falla en vez de generar una clave que nadie conoce.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en las variables de entorno}
      # Firma de sesiones (se recomienda definirla; si se omite se genera y guarda en el volumen).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Detrás de HTTPS (Dokploy/Traefik) la cookie de sesión debe ser Secure. Pon 0 solo si sirves por HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      SIGAE_API_URL: ${SIGAE_API_URL:-https://api.postgradounap.edu.pe/}
      SIGAE_CONVOCATORIA: ${SIGAE_CONVOCATORIA:-adc6bcb2-4935-48f0-9ed8-c55454aad806}
      INTRANET_URL: ${INTRANET_URL:-}
      INTRANET_SERVICE_KEY: ${INTRANET_SERVICE_KEY:-}
    volumes:
      - datos:/data
    networks:
      default:
        # Alias unico para no chocar con otros servicios `api` en dokploy-network.
        aliases:
          - admision-api
    # La API no se publica: solo la alcanza `web`.
    expose:
      - "4351"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Host: api:4351", "http://127.0.0.1:4351/api/salud"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  # docker compose -f docker-compose.prod.yml run --rm importar
  # Copia los Excel en ADMISION_ENTRADA_DIR (por defecto ./data/entrada).
  importar:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/Dockerfile
    volumes:
      - datos:/data
      - ${ADMISION_ENTRADA_DIR:-./data/entrada}:/data/entrada

volumes:
  datos:

networks:
  dokploy-network:
    external: true
